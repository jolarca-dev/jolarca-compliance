name: Vendor review due

# Weekly: checks vendor-assessments/register.csv for processors nearing
# annual re-assessment or DPA renewal; opens a tracking issue.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vendors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check vendor review dates
        id: due
        run: |
          python scripts/vendor-review-dates.py --max-days 60 --machine > /tmp/vendors.txt
          cat /tmp/vendors.txt
          echo "count=$(grep -c '^DUE' /tmp/vendors.txt || true)" >> "$GITHUB_OUTPUT"
      - name: Open vendor review issue
        if: steps.due.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Vendor re-assessment / DPA renewal due" \
            --label "vendor,review-due" \
            --body "$(cat /tmp/vendors.txt)"
