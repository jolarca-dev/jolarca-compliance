# Qodana static analysis — inherited from jol-repo-template, compliance-tuned.
# Community linter: runs fully local (no Qodana Cloud token), matching the
# minimal-supply-chain stance of this evidence repo.
# Local run: make qodana   (or: qodana scan --image jetbrains/qodana-python-community:2026.1)
version: "1.0"
linter: jetbrains/qodana-python-community:2026.1
profile:
  name: qodana.recommended
exclude:
  - name: All
    paths:
      - .venv
      - node_modules
failThreshold: 0
